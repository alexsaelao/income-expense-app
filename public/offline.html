<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Offline - Wallet Code Sabai</title>
    <style>
      :root {
        color-scheme: light dark;
        --card: rgba(255, 255, 255, 0.9);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.18), transparent 40%),
          linear-gradient(180deg, #f8fafc, #e2e8f0);
        color: #0f172a;
      }
      .card {
        width: min(100%, 360px);
        padding: 20px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 24px 70px -30px rgba(15, 23, 42, 0.28);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(254, 226, 226, 0.85);
        color: #b91c1c;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: currentColor;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 24px;
        line-height: 1.15;
      }
      p {
        margin: 0;
        color: #475569;
        line-height: 1.6;
        font-size: 14px;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }
      a, button {
        appearance: none;
        border: 0;
        border-radius: 16px;
        padding: 12px 14px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
      }
      button {
        color: white;
        background: linear-gradient(135deg, #0ea5e9, #22c55e);
      }
      a {
        color: #0f172a;
        background: rgba(148, 163, 184, 0.18);
      }
      .hint {
        margin-top: 12px;
        font-size: 12px;
        color: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(circle at top, rgba(14, 165, 233, 0.18), transparent 40%),
            linear-gradient(180deg, #020617, #0f172a);
          color: #e2e8f0;
        }
        .card {
          background: rgba(2, 6, 23, 0.85);
          border-color: rgba(51, 65, 85, 0.6);
        }
        p, .hint {
          color: #94a3b8;
        }
        a {
          color: #e2e8f0;
          background: rgba(148, 163, 184, 0.16);
        }
      }
    </style>
  </head>
  <body>
    <section class="card">
      <div class="badge"><span class="dot"></span> Offline</div>
      <h1>No internet connection</h1>
      <p>Reconnect to continue. Once the network is back, the app will open again from login.</p>
      <div class="actions">
        <button onclick="window.location.reload()">Try again</button>
        <a href="/login">Go to login</a>
      </div>
      <div class="hint">If you are back online, this page will work normally again.</div>
    </section>
    <script>
      function goToLogin() {
        window.location.replace('/login')
      }

      if (navigator.onLine) {
        goToLogin()
      }

      window.addEventListener('online', goToLogin)
    </script>
  </body>
</html>
