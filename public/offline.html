<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Offline - Income Expense Note</title>
    <style>
      :root {
        color-scheme: dark;
        --bg1: #0f172a;
        --bg2: #111827;
        --card: rgba(15, 23, 42, 0.72);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e2e8f0;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.24), transparent 35%),
          radial-gradient(circle at top right, rgba(16, 185, 129, 0.18), transparent 30%),
          linear-gradient(180deg, var(--bg1), var(--bg2));
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(100%, 420px);
        padding: 28px;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 24px 80px -30px rgba(2,6,23,.8);
        backdrop-filter: blur(20px);
      }
      .logo {
        width: 68px;
        height: 68px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font-size: 30px;
        background: linear-gradient(135deg, #3b82f6, #22c55e);
        box-shadow: 0 14px 30px -16px rgba(59,130,246,.85);
      }
      h1 { margin: 18px 0 8px; font-size: 30px; line-height: 1.1; }
      p { margin: 0; color: #cbd5e1; line-height: 1.6; }
      .actions { display: flex; gap: 12px; margin-top: 24px; }
      button, a {
        appearance: none;
        border: 0;
        text-decoration: none;
        padding: 14px 18px;
        border-radius: 18px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }
      button {
        flex: 1;
        color: white;
        background: linear-gradient(135deg, #2563eb, #06b6d4);
      }
      a {
        color: #e2e8f0;
        background: rgba(148,163,184,.12);
      }
      .hint {
        margin-top: 14px;
        font-size: 13px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <div class="logo">💸</div>
      <h1>You're offline</h1>
      <p>
        Income Expense Note is still available. Your cached data and UI are ready,
        so you can keep reviewing balances, wallets, and recent entries.
      </p>
      <div class="actions">
        <button onclick="window.location.reload()">Try again</button>
        <a href="/">Go home</a>
      </div>
      <div class="hint">The app will sync automatically once the connection returns.</div>
    </section>
  </body>
</html>
